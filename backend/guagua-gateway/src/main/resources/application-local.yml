spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            guagua-user-service:
              - uri: http://localhost:8081
            guagua-content-service:
              - uri: http://localhost:8082
            guagua-post-service:
              - uri: http://localhost:8083
