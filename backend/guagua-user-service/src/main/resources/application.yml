server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: guagua-user-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/guagua_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:guagua123}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

guagua:
  jwt:
    secret: ${JWT_SECRET:tn-guagua-2026-please-change-this-long-secret-key}
    expire-hours: 168

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.tunan.guagua.user: INFO

